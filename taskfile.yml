# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

dotenv:
  - .env

tasks:
  download:
    dir: ./
    cmds:
      - go mod download
  build:
    dir: ./autoscaler
    cmds:
      - go build -o ./dist/autoscaler
  build-runner:
    dir: ./runner
    cmds:
      - docker build --tag runner .
  start:
    dir: ./autoscaler
    env:
      RUNNER_IMAGE: "runner"
      SCALE_SET_NAME: "local-runner"
      LABELS: "linux/amd64,test-1,test-2"
      DOCKER_HOSTS: "unix:///var/run/docker.sock"
      RUNTIME: "sysbox-runc"
      DOCKER_REGISTRY_MIRROR_URL: "http://localhost:5000"
    cmds:
      - task: build
      - task: build-runner
      - ./dist/autoscaler
